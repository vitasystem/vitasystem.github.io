<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050507">
<title>Доктрина Системи Віта</title>
<link rel="icon" type="image/png" sizes="512x512" href="assets/img/vita-icon-512-v9.png">
<link rel="apple-touch-icon" href="assets/img/vita-icon-512-v9.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=mobile-door-films-1">
<style>.doctrine-main{min-height:85vh}.doctrine-main>h1{line-height:1.12;letter-spacing:0;overflow-wrap:break-word}.doctrine-video-banner{position:relative;margin:0;overflow:hidden;background:#081018;line-height:0}.doctrine-video-banner video{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain}.doctrine-video-sound{position:absolute;right:clamp(12px,3vw,28px);bottom:clamp(12px,3vw,24px);z-index:1;display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border:1px solid rgba(241,236,232,.5);border-radius:999px;background:rgba(5,5,7,.65);color:#f1ece8;font:400 10px/1.4 Manrope,sans-serif;letter-spacing:.14em;cursor:pointer}.doctrine-video-sound:focus-visible{outline:2px solid #d39ba9;outline-offset:3px}.doctrine-video-sound[hidden]{display:none}@media(max-width:600px){.doctrine-video-sound{padding:9px 13px;font-size:9px}}</style>
</head>
<body class="info-page">
<header class="site-header info-header"><a class="brand" href="index.html#top">ВІТА</a><div class="header-actions"><a class="info-home" href="index.html#doctrine">НА ГОЛОВНУ</a></div></header>
<main class="info-main doctrine-main"><a class="info-back" href="index.html#doctrine">← ПОВЕРНУТИСЯ ДО ВІТИ</a><h1>Доктрина Системи Віта</h1>
<figure class="doctrine-video-banner">
<video id="doctrine-video" src="assets/video/doktryna-video-baner.mp4" width="1920" height="1080" autoplay muted loop playsinline preload="metadata" controls aria-label="Відеобанер Доктрини Системи Віта"></video>
<button class="doctrine-video-sound" type="button" aria-controls="doctrine-video" aria-pressed="false" aria-label="Увімкнути звук" hidden><span aria-hidden="true">♪</span><span class="doctrine-sound-label">Увімкнути звук</span></button>
</figure>
</main>
<footer><a class="footer-brand" href="index.html#top">ВІТА</a><p>© Victoria Sidney Records</p><p>VITA SYSTEM / 224 FM</p></footer>
<script>
(() => {
const lang=new URLSearchParams(location.search).get('lang') || localStorage.getItem('vita-language') || 'uk';
const video=document.querySelector('#doctrine-video');
const sound=document.querySelector('.doctrine-video-sound');
const english=lang==='en';
const updateSound=()=>{
const on=!video.muted;
sound.setAttribute('aria-pressed',String(on));
const label=on?(english?'Mute':'Вимкнути звук'):(english?'Enable sound':'Увімкнути звук');
sound.setAttribute('aria-label',label);
sound.querySelector('.doctrine-sound-label').textContent=label;
};
video.controls=false;
sound.hidden=false;
updateSound();
video.addEventListener('volumechange',updateSound);
sound.addEventListener('click',()=>{
video.muted=!video.muted;
video.play().catch(()=>{video.controls=true;sound.hidden=true});
});
if(matchMedia('(prefers-reduced-motion: reduce)').matches){
video.autoplay=false;video.pause();video.controls=true;sound.hidden=true;
}else{
video.play().catch(()=>{video.controls=true;sound.hidden=true});
}
window.addEventListener('pagehide',()=>video.pause());
if(!english)return;
video.setAttribute('aria-label','VITA System Doctrine video banner');
document.documentElement.lang='en';
document.title='VITA System Doctrine';
document.querySelector('h1').textContent='VITA System Doctrine';
document.querySelector('.info-home').textContent='HOME';
document.querySelector('.info-back').textContent='← BACK TO VITA';
document.querySelectorAll('a[href^="index.html"]').forEach(a=>{a.href=a.getAttribute('href').replace('index.html#','index.html?lang=en#')});
})();
</script>
</body></html>
