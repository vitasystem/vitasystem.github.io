<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090711">
<meta name="robots" content="noindex,nofollow">
<title>BLACK RABBITS: UNCENSORED — VITA SYSTEM</title>
<link rel="icon" href="assets/img/vita-planet-icon-v2-48.png">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#090711;color:#f5e9fc;font-family:Arial,Helvetica,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(14px,2.5vw,34px);min-height:60px;background:#120b1b;border-bottom:1px solid #764b85}
.brand{font-size:clamp(11px,1.1vw,14px);font-weight:800;letter-spacing:.12em;line-height:1.5}
.brand span{color:#efaafa}
.back{display:inline-block;color:#e8bcfa;text-decoration:none;border:1px solid #775087;border-radius:8px;padding:9px 12px;white-space:nowrap;font-size:12px}
.back:hover,.back:focus-visible{background:#2b1738;border-color:#c58ae3}
main{height:calc(100vh - 60px);height:calc(100dvh - 60px);min-height:620px}
iframe{display:block;width:100%;height:100%;border:0;background:#090711}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:620px){header{min-height:58px;padding:9px 12px}.brand{font-size:10px;letter-spacing:.06em}.back{font-size:10px;padding:9px 10px}main{height:calc(100dvh - 58px);min-height:550px}}
</style>
<style>
.rabbit-afterparty{position:relative;overflow:hidden;min-height:420px;padding:75px 20px 70px;text-align:center;background:radial-gradient(ellipse at 50% 110%,#44205970,transparent 67%),linear-gradient(#090711,#10091b 60%,#070409);border-top:1px solid #a679b535}
.rabbit-afterparty .eyebrow{display:block;color:#bc8dd1;font:10px Arial,sans-serif;letter-spacing:.35em}
.rabbit-afterparty h2{font:400 clamp(30px,5vw,64px)/1.1 Georgia,serif;color:#f2dfff;margin:17px auto 10px}
.rabbit-afterparty p{color:#a78eb3;font:13px/1.7 Arial,sans-serif}
.rabbit-afterparty .crew{margin:35px auto 0;display:flex;justify-content:center;align-items:flex-end;gap:clamp(8px,1.2vw,20px);max-width:1100px;min-height:200px}
.rabbit-afterparty .crew img{display:block;flex:0 1 auto;width:clamp(80px,17%,175px);height:auto;max-height:260px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 12px 23px #a45bc044);animation:crew-bounce 5s ease-in-out infinite;animation-delay:var(--delay)}
@media(max-width:650px){.rabbit-afterparty .crew{gap:3px}.rabbit-afterparty .crew img{width:19%;max-height:160px}}
.rabbit-afterparty .closing{color:#b897c8;letter-spacing:.25em;font:10px Arial,sans-serif;margin-top:34px}
@keyframes crew-bounce{0%,100%{translate:0 0}50%{translate:0 -10px}}
@media(prefers-reduced-motion:reduce){.rabbit-afterparty .crew i{animation:none}}
</style></head>
<body>
<header>
  <div class="brand">VITA SYSTEM <span>/ 224</span> · BLACK RABBITS: UNCENSORED</div>
  <a class="back" id="back" href="index.html?lang=uk#black-rabbit-portal">← ДО ТАЄМНИХ ДВЕРЕЙ</a>
</header>
<main>
  <h1 class="sr-only">BLACK RABBITS: UNCENSORED — інтерактивна гра ВІТИ</h1>
  <iframe id="br-game-frame" title="BLACK RABBITS: UNCENSORED — гра VITA SYSTEM v0.5" src="black-rabbits-game.html" allow="autoplay; fullscreen" allowfullscreen></iframe>
</main>
<section class="rabbit-afterparty" aria-label="Команда чорних кроликів">
<span class="eyebrow">VITA SYSTEM / 224</span><h2>BLACK RABBITS<br>AFTERPARTY</h2><p id="party-text">Ти вже по той бік дверей. А кролики лише починають веселитися.</p>
<div class="crew" aria-hidden="true"><img loading="lazy" decoding="async" src="assets/img/black-rabbits/rabbit-flower.webp?v=afterparty-5" style="--delay:-0s" alt=""><img loading="lazy" decoding="async" src="assets/img/black-rabbits/rabbit-peach.webp?v=afterparty-5" style="--delay:-1s" alt=""><img loading="lazy" decoding="async" src="assets/img/black-rabbits/rabbit-watermelon.webp?v=afterparty-5" style="--delay:-2s" alt=""><img loading="lazy" decoding="async" src="assets/img/black-rabbits/rabbit-bicycle.webp?v=afterparty-5" style="--delay:-3s" alt=""><img loading="lazy" decoding="async" src="assets/img/black-rabbits/rabbit-moped.webp?v=afterparty-5" style="--delay:-4s" alt=""></div><div class="closing">UNCENSORED · THE NIGHT IS YOURS</div>
</section>
<script>
(function(){
  // Leaving the game starts a fresh hunt; game iframe itself remains untouched.
  const huntKey='vita-black-rabbits-collection-v2';
  const resetKey='vita-rabbits-fresh-hunt-after-game';
  function resetHunt(){
    try {
      sessionStorage.removeItem(huntKey);
      localStorage.removeItem(huntKey); // Remove collections from the previous persistent version.
      sessionStorage.setItem(resetKey,'1');
    } catch (_) {}
  }
  window.addEventListener('pagehide',resetHunt);
  document.getElementById('back').addEventListener('click',resetHunt);
  const en=new URLSearchParams(location.search).get('lang')==='en';
  if(en){
    document.documentElement.lang='en';
    document.getElementById('party-text').textContent='You made it through the door. The rabbits are just getting started.';
    document.getElementById('back').textContent='← BACK TO THE SECRET DOORS';
    document.getElementById('back').href='index.html?lang=en#black-rabbit-portal';
  }
})();
</script>
<script src="black-rabbits-mobile-fixes.js?v=20261110-1" defer></script>
</body>
</html>
