<script>
(function(){'use strict';const en=new URLSearchParams(location.search).get('lang')==='en';
if(en){document.documentElement.lang='en';document.getElementById('back').textContent='← BACK TO THE DOORS';document.querySelector('#locked h1').textContent='Access is locked.';document.querySelector('#locked p').textContent='Find five black rabbits across the Music, About VITA, Gallery, Radio and Discography pages to unlock the game.';document.querySelector('#locked a').textContent='BACK TO THE DOORS';}
